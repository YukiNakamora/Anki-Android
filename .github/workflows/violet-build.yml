name: violet-apk

on:
  push:
    branches:
      - 'violet/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK (full flavor)
        run: ./gradlew :AnkiDroid:assembleFullDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnkiDroid-violet-debug
          path: AnkiDroid/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
